<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Homelab · Mission Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0f12'/><circle cx='50' cy='50' r='20' fill='none' stroke='%23f4b740' stroke-width='8'/></svg>" />
</head>
<body>
  <!-- Texture overlays -->
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="shell">
    <!-- ===================== TOP BAR ===================== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">◉</span>
        <div class="brand__text">
          <h1 id="brand-title">HOMELAB</h1>
          <p id="brand-subtitle">Mission Control</p>
        </div>
      </div>

      <div class="topbar__meta">
        <div class="clock" id="clock">
          <span class="clock__time" id="clock-time">--:--:--</span>
          <span class="clock__date" id="clock-date">— — —</span>
        </div>
        <div class="weather-stack">
          <div class="weather" id="weather" hidden>
            <span class="weather__icon" id="weather-icon">—</span>
            <span class="weather__temp" id="weather-temp">--°</span>
            <span class="weather__place" id="weather-place"></span>
          </div>
          <!-- Public IP of the internet connection — populated by app.js -->
          <div class="pubip" id="pubip" hidden>
            <span class="pubip__icon" aria-hidden="true">🌐</span>
            <span class="pubip__value" id="pubip-value">—</span>
            <span class="pubip__label" data-i18n="pubip.label">WAN IP</span>
          </div>
        </div>

        <!-- Theme toggle sits on the weather row; settings.js appends the gear
             below it, on the WAN-IP row. -->
        <div class="meta-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-pressed="false"
            data-i18n-attr="title:theme.toggle,aria-label:theme.toggle"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <g class="icon-moon"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/></g>
              <g class="icon-sun">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </g>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ===================== HERO / SEARCH ===================== -->
    <section class="hero">
      <p class="hero__greeting" id="greeting">Welcome back.</p>

      <form class="search" id="search-form" autocomplete="off" hidden>
        <span class="search__engine" id="search-engine">DDG</span>
        <input
          class="search__input"
          id="search-input"
          type="text"
          placeholder="Search the web   ·   start with  /  to filter your links"
          aria-label="Search"
          data-i18n-attr="placeholder:search.placeholder,aria-label:search.aria"
          spellcheck="false"
        />
        <kbd class="search__hint">↵</kbd>
      </form>

      <!-- Stats strip — a readout of the status checks, hidden without them -->
      <div class="stats" id="stats" hidden>
        <div class="stat">
          <span class="stat__value" id="stat-monitored">0</span>
          <span class="stat__label" data-i18n="stats.monitored">Monitored</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="stat-groups">0</span>
          <span class="stat__label" data-i18n="stats.groups">Groups</span>
        </div>
        <div class="stat">
          <span class="stat__value stat__value--ok" id="stat-online">0</span>
          <span class="stat__label" data-i18n="stats.online">Online</span>
        </div>
        <div class="stat">
          <span class="stat__value stat__value--down" id="stat-offline">0</span>
          <span class="stat__label" data-i18n="stats.offline">Offline</span>
        </div>
      </div>
    </section>

    <!-- ===================== BOOKMARK GROUPS ===================== -->
    <section class="board" id="board" aria-live="polite"></section>

    <div class="empty" id="filter-empty" hidden>
      <span id="filter-message"></span>
    </div>

    <footer class="footer">
      <span>Copyright by locutus010</span>
      <span class="footer__dot">·</span>
      <span><kbd>/</kbd> <span data-i18n="footer.filter">filter links</span></span>
      <span class="footer__dot">·</span>
      <span><kbd>Esc</kbd> <span data-i18n="footer.clear">clear</span></span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
